 <div class="main-content-grid">

    <!-- LEFT COLUMN -->
    <div class="left-column">

      <div class="form-section">
        <div class="section-header">
          <h3 class="page-title">Add New Item</h3>
          <p class="subtitle">Enter details to add</p>
        </div>

        <div class="form-body">

          <div class="form-group">
            <label>Item Name</label>
            <input type="text" placeholder="Enter item name" class="form-control">
          </div>

          <div class="form-group">
            <label>Description</label>
            <input type="text" placeholder="Enter description" class="form-control">
          </div>

          <div class="form-group">
            <label>Category</label>
            <input type="text" placeholder="Enter category" class="form-control">
          </div>

          <div class="form-group">
            <label>Status</label>
            <select class="form-control">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>

        </div>

        <div class="form-footer">
          <button class="cancel-btn">Clear</button>
          <button class="save-btn">Add</button>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-column table-section">

      <div class="table-header-box">
        <h3>Item List <span class="badge">Total</span></h3>

        <div class="relative w-64">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
          </div>

          <input type="search"
            class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
            placeholder="Search items..." />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Item Details</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td>1</td>

            <td>
              <div class="customer-info">
                <div class="avatar">A</div>
                <div>
                  <div class="fw-bold">Sample Item</div>
                  <div class="text-muted">Sample description</div>
                </div>
              </div>
            </td>

            <td>Electronics</td>

            <!-- STATUS COLUMN FIXED -->
            <td>
              <span class="text-green-600 fw-bold">Active</span>
            </td>

            <!-- ACTIONS COLUMN FIXED -->
            <td>
              <button class="action-btn edit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>

              <button class="action-btn delete-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path
                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                  </path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>

        </tbody>
      </table>

    </div>

  </div>
