<div class="main-content-grid">
  <div class="left-column">
    <div class="form-section">
      <div class="section-header">
        <h3 class="page-title" style="color: #0f172a !important;">{{ isEditMode ? 'Edit Item' : 'Add New Item' }}</h3>
        <p class="subtitle" style="color: #64748b !important;">Enter details to save</p>
      </div>

      <div class="form-body">
        <div class="form-group">
          <label style="color: #1e293b !important;">Item Name</label>
          <input type="text" [(ngModel)]="menuItemObj.name" placeholder="Enter item name" class="form-control">
        </div>

        <div class="form-group">
          <label style="color: #1e293b !important;">Category</label>
          <select class="form-control" [(ngModel)]="menuItemObj.categoryId">
            <option [ngValue]="0" disabled selected>-- Select a Category --</option>
            <option *ngFor="let cat of categoryList" [ngValue]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label style="color: #1e293b !important;">Description</label>
          <input type="text" [(ngModel)]="menuItemObj.description" placeholder="Enter description" class="form-control">
        </div>

        <div class="form-group">
          <label style="color: #1e293b !important;">Status</label>
          <select class="form-control" [(ngModel)]="menuItemObj.isAvailable">
            <option [ngValue]="true">Available</option>
            <option [ngValue]="false">UnAvailable</option>
          </select>
        </div>

        <div class="form-group">
          <label style="color: #1e293b !important;">Image URL</label>
          <input type="text" [(ngModel)]="menuItemObj.imageUrl" placeholder="Enter Image Url" class="form-control">
        </div>
      </div>

      <div class="form-footer">
        <button class="cancel-btn" (click)="clearForm()">Clear</button>
        <button *ngIf="!isEditMode" class="save-btn" (click)="addMenuItem()">Add</button>
        <button *ngIf="isEditMode" class="save-btn" style="background-color: #0284c7;" (click)="updateMenuItem()">Save</button>
      </div>
    </div>
  </div>

  <div class="right-column table-section">
    <div class="table-header-box">
      <h3 style="color: #0f172a !important;">Item List <span class="badge">{{ menuItemList.length }}</span></h3>

      <div class="relative w-64">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
          </svg>
        </div>
        <input type="search" class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body" placeholder="Search items..." />
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="color: #0f172a !important;">Id</th>
          <th style="color: #0f172a !important;">Name</th>
          <th style="color: #0f172a !important;">Category</th>
          <th style="color: #0f172a !important;">Description</th>
          <th style="color: #0f172a !important;">Status</th>
          <th style="color: #0f172a !important;">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let menuItems of paginatedData">
          <td class="text-slate-700 font-medium">{{menuItems.id}}</td>

          <td>
            <div class="customer-info">
              <div>
                <div class="fw-bold text-slate-800">{{menuItems.name}}</div>
              </div>
            </div>
          </td>                
          
          <td class="text-slate-700">{{menuItems.categoryName}}</td>
          <td class="text-slate-700">{{menuItems.description}}</td>

          <td>
            <div>
                <span *ngIf="menuItems.isAvailable" style="color: #16a34a; font-weight: bold;">Available</span>
                <span *ngIf="!menuItems.isAvailable" style="color: #dc2626; font-weight: bold;">UnAvailable</span>
              </div>
          </td>

          <td>
            <div style="display: flex; gap: 8px; align-items: center; white-space: nowrap;">
              <button class="action-btn edit-btn" (click)="onEdit(menuItems)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>

              <button class="action-btn delete-btn" (click)="deleteMenuItem(menuItems.id)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination-container" *ngIf="totalPages > 1">
      <button class="page-btn" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>
      
      <button class="page-btn" *ngFor="let page of getPagesArray()" 
              [class.active]="currentPage === page" 
              (click)="changePage(page)">
        {{ page }}
      </button>

      <button class="page-btn" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
    </div>

  </div>
</div>
