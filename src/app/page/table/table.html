<table class="min-w-full text-left border">
  <thead class="bg-gray-200">
    <tr>
      <th class="p-2 border">Waiter ID</th>
      <th class="p-2 border">Order ID</th>
      <th class="p-2 border">Table No</th>
      <th class="p-2 border">Status</th>
      <th class="p-2 border">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let order of orderList">
      <td class="p-2 border">{{ order.waiterId }}</td>
      <td class="p-2 border">{{ order.orderId }}</td>
      <td class="p-2 border">{{ order.tableNo }}</td>
      <td class="p-2 border">{{ order.status }}</td>
      <td class="p-2 border">
        <button class="bg-green-500 text-white px-3 py-1 rounded"
                (click)="serveOrder(order.orderId)">
          Served
        </button>
      </td>
    </tr>
  </tbody>
</table>
