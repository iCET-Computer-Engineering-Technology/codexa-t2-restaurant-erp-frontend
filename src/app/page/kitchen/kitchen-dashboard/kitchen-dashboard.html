<div class="kitchen-dashboard">

    <!-- Total Orders -->

    <!-- Received -->

        </div>
    </div>


    <!-- Preparing -->

            <div>

        </div>
    </div>


    <!-- Ready -->

            <div>
                <p class="text-sm text-gray-600">Ready</p>

            </div>

            <div class="w-10 h-10 flex items-center justify-center rounded-full bg-green-100">
                <span class="w-3 h-3 bg-green-500 rounded-full"></span>
            </div>

        </div>
    </div>

</div>
