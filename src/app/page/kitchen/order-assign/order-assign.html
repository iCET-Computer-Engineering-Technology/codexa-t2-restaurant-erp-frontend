<div class="bg-neutral-primary-soft border border-default rounded-base shadow-xs p-6">

    <h2 class="text-lg font-semibold text-heading mb-6">
        Order Assign
    </h2>

    <table class="w-full text-sm text-left text-body">

        <thead class="bg-neutral-secondary-medium border-b border-t border-default-medium">

            <tr>
                <th class="px-6 py-3 text-center">
                    ID
                </th>

                <th class="px-6 py-3 text-center">
                    Table
                </th>

                <th class="px-6 py-3 text-center">
                    Order
                </th>


                <th class="px-6 py-3 text-center">
                    Items
                </th>

                <th class="px-6 py-3 text-center">
                    Waiter
                </th>

                <th class="px-6 py-3 text-center">
                    Action
                </th>

            </tr>

        </thead>

        <tbody>

            @for (order of orders(); track order.id) {
            <tr class="border-b border-default hover:bg-neutral-secondary-medium">

                <td class="px-6 py-4 text-center font-semibold">
                    {{ order.id }}
                </td>

                <td class="px-6 py-4 text-center">
                    <span class="px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 rounded-full">
                        Table {{ order.tableId }}
                    </span>
                </td>

                <td class="px-6 py-4 text-center font-semibold">
                    {{ order.orderNumber }}
                </td>

                <td class="px-6 py-4">
                    <div class="flex flex-wrap gap-1">
                        @for (item of order.items; track item.id) {
                        <span class="inline-block px-2 py-1 text-xs bg-neutral-secondary-medium rounded">
                            Item {{ item.menuItemId }}
                        </span>
                        }
                    </div>
                </td>

                <td class="px-6 py-4 text-center">
                    <div class="flex justify-center">
                        <select
                            #waiter
                            class="w-44 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base px-3 py-2 shadow-xs focus:ring-2 focus:ring-brand focus:border-brand cursor-pointer">
                            <option value="" selected>Select waiter</option>
                            @for (w of waiters(); track w.id) {
                            <option [value]="w.id">{{ w.name }}</option>
                            }
                        </select>
                    </div>
                </td>

                <td class="px-6 py-4 text-center">
                    <button
                        type="button"
                        (click)="assignWaiter(order.id, waiter.value)"
                        class="px-3 py-1 text-xs bg-blue-600 text-white rounded">
                        Assign
                    </button>
                </td>

            </tr>
            } @empty {
            <tr>
                <td colspan="6" class="px-6 py-8 text-center text-body">No orders available.</td>
            </tr>
            }

        </tbody>

    </table>

</div>
