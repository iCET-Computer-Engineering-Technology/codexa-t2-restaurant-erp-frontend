<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">

    <div class="flex items-center justify-between flex-wrap p-4">

        <h2 class="text-lg font-semibold text-heading">
            Kitchen Orders
        </h2>

        <div class="relative">
            <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-body" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-width="2"
                        d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                </svg>
            </div>

            <input type="text"
                class="block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base"
                placeholder="Search order...">

        </div>

    </div>

    <table class="w-full text-sm text-left text-body">

        <thead class="text-sm bg-neutral-secondary-medium border-b border-t border-default-medium">

            <tr>

                <th class="px-6 py-3 font-medium text-center">
                    ID
                </th>

                <th class="px-6 py-3 font-medium text-center">
                    Table
                </th>

                <th class="px-6 py-3 font-medium text-center">
                    Order Number
                </th>

                <th class="px-6 py-3 font-medium text-center">
                    Items
                </th>

                <th class="px-6 py-3 font-medium text-center">
                    Status
                </th>

                <th class="px-6 py-3 font-medium text-center">
                    Action
                </th>

            </tr>

        </thead>
        <tbody>

            @for (order of orders(); track order.id) {
            <tr class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium transition">

                <td class="px-6 py-4 font-semibold text-center">
                    {{ order.id }}
                </td>

                <td class="px-6 py-4 text-center">
                    <span class="px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 rounded-full">
                        Table {{ order.tableId }}
                    </span>
                </td>

                <td class="px-6 py-4 font-semibold text-heading text-center">
                    {{ order.orderNumber }}
                </td>

                <td class="px-6 py-4">
                    <div class="flex flex-wrap gap-1">
                        @for (item of order.items; track item.id) {
                        <span class="inline-block px-2 py-1 text-xs bg-neutral-secondary-medium rounded">
                            Item {{ item.menuItemId }}
                        </span>
                        }
                    </div>
                </td>

                <td class="px-6 py-4 text-center">
                    <span class="px-3 py-1 text-xs font-semibold bg-yellow-100 text-yellow-700 rounded-full">
                        {{ order.status }}
                    </span>
                </td>

                <td class="px-6 py-4">
                    <div class="flex justify-center">
                        <button
                            type="button"
                            class="flex items-center gap-2 text-white bg-brand hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium font-medium rounded-full text-sm px-4 py-2 transition">
                            Preparing
                        </button>
                    </div>
                </td>

            </tr>
            } @empty {
            <tr>
                <td colspan="6" class="px-6 py-8 text-center text-body">No kitchen orders found.</td>
            </tr>
            }

        </tbody>

    </table>

</div>
