<div class="min-h-screen bg-gray-100 p-5 font-sans">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Checkout</h1>
      <p class="text-sm text-gray-500">Complete payment for Order <span class="font-bold text-blue-600">#ORD-20260406-0001</span></p>
    </div>
    <button class="text-sm font-semibold text-gray-500 transition hover:text-gray-900">
      &larr; Back to Order
    </button>
  </div>

  <div class="grid grid-cols-1 gap-8 lg:grid-cols-12">
    
    <div class="space-y-6 lg:col-span-7">
      
      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
        <h2 class="mb-4 text-lg font-bold text-gray-800">1. Payment Method</h2>
        
        <div class="grid grid-cols-2 gap-4">
          <label class="relative flex cursor-pointer rounded-xl border-2 border-blue-600 bg-blue-50 p-4 transition hover:bg-blue-50">
            <input type="radio" name="paymentType" value="CASH" class="sr-only" checked>
            <div class="flex w-full items-center justify-between">
              <span class="font-bold text-blue-900">💵 Cash</span>
              <svg class="h-6 w-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
              </svg>
            </div>
          </label>

          <label class="relative flex cursor-pointer rounded-xl border-2 border-gray-200 bg-white p-4 transition hover:border-blue-400">
            <input type="radio" name="paymentType" value="CARD" class="sr-only">
            <div class="flex w-full items-center justify-between">
              <span class="font-bold text-gray-700">💳 Card</span>
            </div>
          </label>
        </div>
      </div>

      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
        <h2 class="mb-4 text-lg font-bold text-gray-800">2. Add Tip</h2>
        <div class="flex gap-3 mb-4">
          <button type="button" class="flex-1 rounded-lg border border-gray-300 py-2 font-semibold text-gray-700 transition hover:bg-gray-50">No Tip</button>
          <button type="button" class="flex-1 rounded-lg border border-gray-300 py-2 font-semibold text-gray-700 transition hover:bg-gray-50">Rs. 50</button>
          <button type="button" class="flex-1 rounded-lg border border-blue-600 bg-blue-600 py-2 font-semibold text-white transition">Rs. 100</button>
        </div>
      </div>

    </div>

    <div class="lg:col-span-5">
      <div class="relative rounded-t-xl bg-white p-6 shadow-md border-t-8 border-blue-800">
        
        <div class="text-center mb-6">
          <h2 class="text-2xl font-black uppercase tracking-widest text-gray-900">INVOICE</h2>
          <p class="text-sm text-gray-500 mt-1">Ref: TXN-8492</p>
          <p class="text-xs text-gray-400">April 6, 2026, 10:45 PM</p>
        </div>

        <div class="my-4 border-b-2 border-dashed border-gray-300"></div>

        <div class="space-y-3 mb-6">
          <div class="flex justify-between text-sm text-gray-800">
            <span class="font-medium">
              <span class="mr-2 text-gray-400">1.</span>
              Garlic Bread <span class="text-xs text-gray-500">(x1)</span>
            </span>
            <span>Rs. 350.00</span>
          </div>
          
          <div class="flex justify-between text-sm text-gray-800">
            <span class="font-medium">
              <span class="mr-2 text-gray-400">2.</span>
              Chicken Pizza <span class="text-xs text-gray-500">(x2)</span>
            </span>
            <span>Rs. 2400.00</span>
          </div>
        </div>

        <div class="my-4 border-b-2 border-dashed border-gray-300"></div>

        <div class="space-y-2 text-sm text-gray-600">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span class="font-medium text-gray-900">Rs. 2750.00</span>
          </div>
          <div class="flex justify-between text-blue-600">
            <span>Tip Added</span>
            <span>+ Rs. 100.00</span>
          </div>
        </div>

        <div class="mt-6 rounded-lg bg-gray-50 p-4">
          <div class="flex items-center justify-between text-xl font-black text-gray-900">
            <span>TOTAL</span>
            <span>Rs. 2850.00</span>
          </div>
        </div>
      </div>
      
      <div class="h-4 w-full bg-[radial-gradient(circle_at_bottom,transparent_4px,#ffffff_5px)] bg-[length:16px_16px] shadow-sm"></div>

      <button type="button" class="mt-6 w-full rounded-xl bg-green-600 py-4 text-lg font-black text-white shadow-lg transition hover:bg-green-700 hover:shadow-xl">
        PAY Rs. 2850.00
      </button>
      
    </div>
  </div>
</div>
