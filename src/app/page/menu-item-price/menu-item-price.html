<div class="dashboard-container">
  <h2 class="page-title">Menu Item Pricing</h2>
  
  <div class="main-content-grid">

    <div class="left-column">
      <div class="form-section">
        <div class="section-header">
          <h3 class="section-title">Add New Price</h3>
          <p class="subtitle">Set a price for an item's portion</p>
        </div>

        <div class="form-body">
          <div class="form-group">
            <label>Item Id</label>
              <input type="number" [(ngModel)]="menuItemPriceObj.itemId" step="0.01" placeholder="Item Id" class="form-control">
          </div>

          <div class="form-group">
            <label>Portion Id</label>
              <input type="number" [(ngModel)]="menuItemPriceObj.portionId" step="0.01" placeholder="Portion Id" class="form-control">
          </div>

          <div class="form-group">
            <label>Price</label>
            <input type="number" [(ngModel)]="menuItemPriceObj.price" step="0.01" placeholder="e.g. 15.00" class="form-control">
          </div>

          <div class="form-group">
            <label>Status</label>
            <select class="form-control" [(ngModel)]="menuItemPriceObj.isActive">
              <option value="true" [ngValue]="true">Active</option>
              <option value="false" [ngValue]="false">Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-footer">
          <button class="cancel-btn" (click)="clearForm()">Clear</button>
          <button *ngIf="!isEditMode" class="save-btn" (click)="addMenuItemPrice()">Add</button>
          <button *ngIf="isEditMode" class="save-btn" style="background-color: #0284c7;"
            (click)="updateMenuItemPrice()">save</button>
        </div>
      </div>
    </div>

    <div class="right-column table-section">
      <div class="table-header-box">
        <h3 class="section-title">Pricing List <span class="badge">Total: 1</span></h3>

        <div class="search-container">
          <div class="search-icon-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
          </div>
          <input type="search" class="search-input" placeholder="Search pricing..." />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Item Id</th>
            <th>Portion Id</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let menuItemPrice of menuItemPriceList">
            <td class="fw-bold">{{menuItemPrice.id}}</td>

            <td class="fw-bold">{{menuItemPrice.itemId}}</td>
            <td class="fw-bold">{{menuItemPrice.portionId}}</td>

            <td class="fw-bold">{{menuItemPrice.price}}</td>

            <td>
              <div>
                  <span *ngIf="menuItemPrice.isActive" style="color: #16a34a; font-weight: bold;">Active</span>
                  <span *ngIf="!menuItemPrice.isActive" style="color: #dc2626; font-weight: bold;">Inactive</span>
                </div>
            </td>

            <td>
              <button class="action-btn edit-btn" title="Edit" (click)="onEdit(menuItemPrice)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
              <button class="action-btn delete-btn" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
