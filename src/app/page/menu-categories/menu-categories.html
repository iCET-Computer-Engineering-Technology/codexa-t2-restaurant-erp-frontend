<div class="dashboard-container">
  
  <div class="main-content-grid">

    <div class="left-column">
      <div class="form-section">
        <div class="section-header">
          <h3 class="section-title">Add New Category</h3>
          <p class="subtitle">Enter category details to add</p>
        </div>

        <div class="form-body">
          <div class="form-group">
            <label >Category Name</label>
            <input type="text"  name="name" [(ngModel)]="categoryObj.name" placeholder="e.g. Electronics, Clothing" class="form-control">
          </div>
          
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" [(ngModel)]="categoryObj.isActive">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-footer">
          <button class="cancel-btn" (click)="clearForm()">Clear</button>
          <button class="save-btn" (click)="addCategory()">Add Category</button>
        </div>
      </div>
    </div>

    <div class="right-column table-section">
      <div class="table-header-box">
        <h3 class="section-title">Category List <span class="badge">Total: 2</span></h3>

        <div class="search-container">
          <div class="search-icon-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
          </div>
          <input type="search" class="search-input" placeholder="Search categories..." />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Category Name</th>
            <th>Category Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          
          <tr *ngFor="let category of categoryList">
            <td>{{category.id}}</td>
            <td>
              <div class="category-info">
                  <div class="fw-bold">{{category.name}}</div>
              </div>
            </td> 
            <td>  
                <div>
                  <span *ngIf="category.isActive" style="color: #16a34a; font-weight: bold;">Active</span>
                  <span *ngIf="!category.isActive" style="color: #dc2626; font-weight: bold;">Inactive</span>
                </div>
            </td>
                <!-- <div>
                  <div class="fw-bold">{{category.isActive}}</div>
                </div> -->
            
            <td>
              <button class="action-btn edit-btn" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
              <button class="action-btn delete-btn" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>


          </tbody>
      </table>
    </div>
  </div>
</div>
