<button
   data-drawer-target="logo-sidebar"
   data-drawer-toggle="logo-sidebar"
   aria-controls="logo-sidebar"
   type="button"
   class="sidebar-mobile-toggle fixed top-4 left-4 z-50 font-medium rounded-lg text-sm p-2.5 focus:outline-none inline-flex sm:hidden transition-all duration-200"
   [class.sidebar-mobile-toggle-light]="!isDarkMode()">
   <span class="sr-only">Open sidebar</span>
   <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h10" />
   </svg>
</button>

<aside id="logo-sidebar" class="fixed top-0 left-0 z-40 w-72 h-full transition-transform -translate-x-full sm:translate-x-0" aria-label="Sidebar">
   <div class="sidebar-wrapper h-full flex flex-col overflow-y-auto" [class.sidebar-wrapper-light]="!isDarkMode()">
      <div class="sidebar-brand flex items-center gap-3 px-6 py-5">
         <div class="sidebar-brand-icon flex items-center justify-center w-10 h-10 rounded-xl">
            <img src="/RERP_main_logo.gif" alt="Restaurant ERP Sidebar Logo" class="w-20 h-20 object-contain">
         </div>
         <div>
            <h1 class="text-lg font-bold leading-tight tracking-tight"
               [class.text-white]="isDarkMode()"
               [class.text-slate-900]="!isDarkMode()">Restaurant</h1>
            <span class="sidebar-brand-sub text-xs font-medium tracking-widest uppercase">ERP Admin</span>
         </div>
      </div>

      <div class="sidebar-divider mx-5 mb-4"></div>

      <nav class="flex-1 px-4">
         <p class="sidebar-section-label px-3 mb-2 text-[10px] font-semibold uppercase tracking-wider">Main Menu</p>

         <ul class="space-y-1">
            <li>
               <button type="button" routerLink="admin-dashboard" routerLinkActive="sidebar-item-active"
                  class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 group">
                  <div class="sidebar-item-icon flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-200">
                     <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z" />
                     </svg>
                  </div>
                  <span>Dashboard</span>
               </button>
            </li>
            <li>
               <button type="button" routerLink="admin-customer" routerLinkActive="sidebar-item-active"
                  class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 group">
                  <div class="sidebar-item-icon flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-200">
                     <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                     </svg>
                  </div>
                  <span>Customers</span>
               </button>
            </li>
            <li>
               <button type="button" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 group">
                  <div class="sidebar-item-icon flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-200">
                     <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                     </svg>
                  </div>
                  <span class="flex-1">Inbox</span>
                  <span class="sidebar-badge flex items-center justify-center min-w-5.5 h-5.5 px-1.5 text-[11px] font-bold rounded-full">2</span>
               </button>
            </li>
         </ul>

         <p class="sidebar-section-label px-3 mt-6 mb-2 text-[10px] font-semibold uppercase tracking-wider">Management</p>

         <ul class="space-y-1">
            <li>
               <button type="button" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 group">
                  <div class="sidebar-item-icon flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-200">
                     <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                     </svg>
                  </div>
                  <span>Users</span>
               </button>
            </li>
            <li>
               <button type="button" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 group">
                  <div class="sidebar-item-icon flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-200">
                     <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                     </svg>
                  </div>
                  <span>Products</span>
               </button>
            </li>
         </ul>
      </nav>

      <div class="flex-1"></div>

      <div class="sidebar-divider mx-5 mt-2"></div>

      <div class="px-4 py-4">
         <div class="sidebar-user-card flex items-center gap-3 px-3 py-3 rounded-xl mb-3">
            <div class="sidebar-avatar flex items-center justify-center w-10 h-10 rounded-full text-white font-bold text-sm">
               A
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-sm font-semibold text-white truncate">Admin User</p>
               <p class="sidebar-user-role text-xs truncate">Administrator</p>
            </div>
         </div>

         <div class="flex items-stretch gap-3">
            <button
               type="button"
               class="sidebar-theme-toggle flex items-center justify-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200"
               [class.sidebar-theme-toggle-light]="!isDarkMode()"
               (click)="toggleTheme()"
               [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
               [title]="isDarkMode() ? 'Light mode' : 'Dark mode'">
               @if (isDarkMode()) {
                  <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m8.25-9H21M3 12H4.5m13.364 5.864 1.06 1.06M5.636 6.136l1.06 1.06m11.728 0 1.06-1.06M5.636 17.864l1.06-1.06M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                  </svg>
               } @else {
                  <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 1 0 21.752 15.002Z" />
                  </svg>
               }
            </button>

            <button type="button" routerLink="" class="sidebar-signout flex-1 flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200">
               <div class="flex items-center justify-center w-9 h-9 rounded-lg">
                  <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                  </svg>
               </div>
               <span>Sign Out</span>
            </button>
         </div>
      </div>
   </div>
</aside>
