<div class="inventory-container">
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <h1>Inventory</h1>
      </div>
      
      <div class="header-right">
        <div class="search-container">
          <div class="relative">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
              <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                  d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
              </svg>
            </div>
            <input type="text" id="search" [(ngModel)]="searchText" (input)="onSearch()"
              class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
              placeholder="Search" />
          </div>
        </div>
        
        <div class="header-actions">
          <div class="user-avatar">FK</div>
        </div>
      </div>
    </header>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-12">
      <div class="text-center">
        <div class="mb-4">Loading...</div>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && !error && inventoryItems.length === 0" class="flex justify-center items-center py-12">
      <div class="text-center text-gray-500">
        <p>No ingredients found</p>
      </div>
    </div>

    <!-- Data Table -->
    <div *ngIf="!isLoading && inventoryItems.length > 0" class="table-container">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Ingredient ID</th>
            <th>Ingredient Name</th>
            <th>Supplier SKU</th>
            <th>Unit Price</th>
            <th>Min Order Qty</th>
            <th>Price Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of inventoryItems">
            <td>{{ item.ingredientId }}</td>
            <td>{{ item.ingredientName }}</td>
            <td>{{ item.supplierSku }}</td>
            <td>{{ item.unitPrice }}</td>
            <td>{{ item.minOrderQty }}</td>
            <td>{{ item.priceDate }}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
