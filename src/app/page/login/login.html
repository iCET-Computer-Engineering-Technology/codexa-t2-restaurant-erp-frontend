<div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div id="customImg" class="welcome-section mix-color">
            <h1 class="welcome-text">WELCOME</h1>
        </div>
        <div class="login-section">
            <div class="login-card">
                <h2>LOGIN</h2>
                <div class="user-type-selector">
                    <form class="login-form" (ngSubmit)="handleAdminLogin($event)">
                        <div *ngIf="errorMessage" class="error-message"
                            style="color: red; margin-bottom: 15px; font-size: 14px;">
                            {{ errorMessage }}
                        </div>

                        <label for="adm-email">USER NAME</label>
                        <div class="input-group">
                            <input type="text" id="adm-email" placeholder="UserName" [(ngModel)]="username"
                                name="username" [disabled]="isLoading" required>
                        </div>
                        <label for="adm-password">PASSWORD</label>
                        <div class="input-group password-group">
                            <input [type]="showPassword ? 'text' : 'password'" id="adm-password" placeholder="********"
                                [(ngModel)]="password" name="password" [disabled]="isLoading" required>
                            <span class="password-toggle" (click)="togglePasswordVisibility()" style="cursor: pointer;">
                                <i [class]="showPassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                            </span>
                        </div>

                        <button class="login-btn" type="submit" [disabled]="isLoading">
                            {{ isLoading ? 'LOGGING IN...' : 'LOGIN' }}
                        </button>
                    </form>
                </div>
                <div class="login-form-container" id="login-form-containerToLoad"></div>
            </div>
        </div>
    </div>
</div>
