<div class="login-wrapper">
    <div class="container fade-in">
        <!-- Welcome Section -->
        <div id="customImg" class="welcome-section mix-color">
            <div class="welcome-content">
                <div class="welcome-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <h1 class="welcome-text">Restaurant<span class="text-accent">ERP</span></h1>
                <p class="welcome-subtitle">Management System</p>
            </div>
        </div>

        <!-- Login Section -->
        <div class="login-section">
            <div class="login-card slide-up">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p class="login-subtitle">Sign in to your account</p>
                </div>

                <form class="login-form" (ngSubmit)="handleAdminLogin($event)">
                    <!-- Error Message -->
                    <div *ngIf="errorMessage" class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ errorMessage }}
                    </div>

                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="adm-email">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="adm-email" 
                                placeholder="Enter your username"
                                [(ngModel)]="username"
                                name="username" 
                                [disabled]="isLoading"
                                class="form-input"
                                required>
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="adm-password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div class="input-wrapper password-wrapper">
                            <input 
                                [type]="showPassword ? 'text' : 'password'" 
                                id="adm-password" 
                                placeholder="Enter your password"
                                [(ngModel)]="password" 
                                name="password" 
                                [disabled]="isLoading"
                                class="form-input"
                                required>
                            <span class="password-toggle" (click)="togglePasswordVisibility()" title="Toggle password visibility">
                                <i [class]="showPassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button class="login-btn" type="submit" [disabled]="isLoading">
                        <span class="btn-content">
                            <i [class]="isLoading ? 'fas fa-spinner fa-spin' : 'fas fa-sign-in-alt'"></i>
                            {{ isLoading ? 'Signing in...' : 'Sign In' }}
                        </span>
                    </button>
                </form>

                <div class="login-footer">
                    <p>© 2026 RestaurantERP. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>
</div>
